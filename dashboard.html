<!DOCTYPE html>
<html>

<head>
    <title>Pluto Analytics Dashboard</title>

    <style>

        body{
            margin:40px;
            background:#111827;
            color:white;
            font-family:Arial;
        }

        h1{
            color:#38bdf8;
        }

        .grid{
            display:grid;
            grid-template-columns:repeat(4,1fr);
            gap:20px;
            margin-top:30px;
        }

        .card{
            background:#1f2937;
            padding:20px;
            border-radius:15px;
            text-align:center;
        }

        .value{
            font-size:42px;
            font-weight:bold;
            margin-top:10px;
            color:#4ade80;
        }

        .section{
            margin-top:40px;
        }

        img{
            width:100%;
            border-radius:10px;
            background:white;
        }

    </style>

</head>

<body>

<h1>🚀 Pluto Analytics</h1>

<div class="grid">

<div class="card">
<h2>Visitors Today</h2>
<div class="value">{{data.total_visits}}</div>
</div>

<div class="card">
<h2>Peak Hour</h2>
<div class="value">{{data.peak_hour}}</div>
</div>

<div class="card">
<h2>Average Dwell</h2>
<div class="value">{{data.avg_dwell}} s</div>
</div>

<div class="card">
<h2>Risk Score</h2>
<div class="value">{{data.risk_score}}</div>
</div>

</div>

<div class="section">


<div class="section">

<h2>Live Camera</h2>

<img src="/video_feed">

</div>


<h2>Hourly Visitors</h2>

<img src="/static/hourly_visitors.png">

</div>

<div class="section">

<h2>Heatmap</h2>

<img src="/static/heatmap.png">
</div>

</body>

</html>
